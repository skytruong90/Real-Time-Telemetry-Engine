name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end telemetry demo
        run: |
          python src/telemetry_engine.py --demo --frames 100 --queue-size 256 --output-dir output
          test -s output/telemetry.jsonl
          test -s output/summary.json
